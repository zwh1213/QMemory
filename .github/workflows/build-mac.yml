name: build-mac

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '上传到该 Release（留空则只产出 artifact，不碰 Release）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: 生成 .icns 图标
        run: |
          python - <<'PY'
          from PIL import Image
          im = Image.open("imgs/icon.ico").convert("RGBA")
          if max(im.size) < 1024:
              im = im.resize((1024, 1024), Image.LANCZOS)
          im.save("icon_1024.png")
          PY
          mkdir -p icon.iconset
          for spec in 16:icon_16x16 32:icon_16x16@2x 32:icon_32x32 64:icon_32x32@2x \
                      128:icon_128x128 256:icon_128x128@2x 256:icon_256x256 \
                      512:icon_256x256@2x 512:icon_512x512 1024:icon_512x512@2x; do
            size="${spec%%:*}"
            name="${spec##*:}"
            sips -z "$size" "$size" icon_1024.png --out "icon.iconset/$name.png" >/dev/null
          done
          iconutil -c icns icon.iconset -o imgs/icon.icns

      - name: 打包
        run: |
          VERSION="${{ github.event.inputs.tag }}"
          if [ -z "$VERSION" ]; then VERSION="${GITHUB_REF_NAME}"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          ARCH_FLAG=""
          if python -c "import sysconfig,sys; sys.exit(0 if 'universal2' in sysconfig.get_platform() else 1)"; then
            ARCH_FLAG="--target-arch universal2"
            echo "Python 为 universal2，构建通用二进制"
          else
            echo "Python 为 $(python -c 'import sysconfig; print(sysconfig.get_platform())')，构建单架构"
          fi

          python -m PyInstaller --noconfirm --onefile --windowed \
            --name "QMemory-$VERSION" \
            --icon imgs/icon.icns \
            --osx-bundle-identifier com.zwh1213.qmemory \
            --add-data "templates:templates" \
            --add-data "imgs/icon.ico:imgs" \
            $ARCH_FLAG \
            main.py --log-level=WARN

          cd dist
          zip -r -y "QMemory-$VERSION-macOS.zip" "QMemory-$VERSION.app"

      - uses: actions/upload-artifact@v4
        with:
          name: QMemory-macOS
          path: dist/*.zip
          if-no-files-found: error

      - name: 上传到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            case "${GITHUB_REF}" in
              refs/tags/*) TAG="${GITHUB_REF_NAME}" ;;
            esac
          fi
          if [ -z "$TAG" ]; then
            echo "未指定 Release，跳过上传（artifact 已产出）"
            exit 0
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber
          else
            gh release create "$TAG" dist/*.zip --title "$TAG" --generate-notes
          fi
