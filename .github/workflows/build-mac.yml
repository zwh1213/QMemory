name: build-mac

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '上传到该 Release（留空则只产出 artifact，不碰 Release）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: 生成 .icns 图标
        run: |
          python - <<'PY'
          from PIL import Image
          im = Image.open("imgs/icon.ico").convert("RGBA")
          if max(im.size) < 1024:
              im = im.resize((1024, 1024), Image.LANCZOS)
          im.save("icon_1024.png")
          PY
          mkdir -p icon.iconset
          for spec in 16:icon_16x16 32:icon_16x16@2x 32:icon_32x32 64:icon_32x32@2x \
                      128:icon_128x128 256:icon_128x128@2x 256:icon_256x256 \
                      512:icon_256x256@2x 512:icon_512x512 1024:icon_512x512@2x; do
            size="${spec%%:*}"
            name="${spec##*:}"
            sips -z "$size" "$size" icon_1024.png --out "icon.iconset/$name.png" >/dev/null
          done
          iconutil -c icns icon.iconset -o imgs/icon.icns

      - name: 打包
        run: |
          VERSION="${{ github.event.inputs.tag }}"
          if [ -z "$VERSION" ]; then VERSION="${GITHUB_REF_NAME}"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          python -m PyInstaller --noconfirm --onefile --windowed \
            --name "QMemory-$VERSION" \
            --icon imgs/icon.icns \
            --osx-bundle-identifier com.zwh1213.qmemory \
            --add-data "templates:templates" \
            --add-data "imgs/icon.ico:imgs" \
            main.py --log-level=WARN

          cd dist
          zip -r -y "QMemory-$VERSION-macOS-${{ matrix.arch }}.zip" "QMemory-$VERSION.app"

      - uses: actions/upload-artifact@v4
        with:
          name: QMemory-macOS-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    needs: build
    if: github.event.inputs.tag != '' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: QMemory-macOS-*
          merge-multiple: true
          path: dist

      - name: 上传到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF_NAME}"; fi
          ls -lh dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber
          else
            gh release create "$TAG" dist/*.zip --title "$TAG" --generate-notes
          fi
